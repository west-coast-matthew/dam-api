# Defaults bundled in the jar. Credentials and environment specific values
# are supplied at runtime from /etc/app-config/dam/application.properties
# (see config/application.properties.sample and bin/deploy).

spring.application.name=dam-api
server.port=8080

# ---- Database (MariaDB) ----
# Connection values come from the dam.db.* properties in the external config.
# server, port and name have defaults; username and password must be set.
dam.db.server=localhost
dam.db.port=3306
dam.db.name=dam
spring.datasource.url=jdbc:mariadb://${dam.db.server}:${dam.db.port}/${dam.db.name}
spring.datasource.username=${dam.db.username:}
spring.datasource.password=${dam.db.password:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.pool-name=dam-pool
# Start even when the database is down so /heartbeat can report it
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ---- Logging: debug level, console output (pattern in logback-spring.xml) ----
logging.level.root=INFO
logging.level.com.twofourseven.dam=DEBUG

# ---- Asset storage (see STORAGE_SPECIFICATION.md) ----
# Root folder for asset files; override in the external config.
dam.storage.root-dir=/var/data/dam
# Largest file accepted from inside an uploaded zip
dam.storage.max-extracted-size=2GB
# Most media files accepted in one bulk upload (POST /assets/bulk)
dam.storage.max-bulk-files=1000
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
